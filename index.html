<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Controle de Ponto - Clínica-Escola UNINASSAU</title>
    <meta name="description" content="Sistema completo de controle de ponto da Clínica-Escola UNINASSAU" />
    <link rel="preconnect" href="https://dhqcbtdbkdbvbxgddjqh.supabase.co" />
    <style>
      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #002B49;
        color: #FFF;
        font-family: system-ui, -apple-system, sans-serif;
        gap: 1rem;
      }
      #loading-screen .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #FFF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-screen.error { background: #FFF; color: #333; }
      #loading-screen.error .spinner { display: none; }
      #loading-screen.error .error-msg { color: #DC2626; font-weight: 600; }
      #loading-screen.error .error-hint { color: #666; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen">
        <div class="spinner"></div>
        <span>Carregando sistema...</span>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var el = document.getElementById('loading-screen');
        if (el && !el.classList.contains('error')) {
          el.classList.add('error');
          el.innerHTML =
            '<div class="error-msg">Falha ao carregar o sistema</div>' +
            '<div class="error-hint">Possivelmente um problema de cache do navegador.</div>' +
            '<div class="error-hint" style="margin-top:1rem">' +
            '<b>Como resolver:</b><br>' +
            '1. Pressione <b>Ctrl + Shift + R</b> (hard refresh)<br>' +
            '2. Ou abra em janela anônima (Ctrl+Shift+N)<br>' +
            '3. Ou limpe os dados do site no DevTools (F12 → Application → Storage → Clear site data)' +
            '</div>';
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
