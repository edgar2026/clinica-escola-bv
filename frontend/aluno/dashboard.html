<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard do Aluno</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Meu Painel</span>
      <button class="btn btn-outline-light" onclick="logout()">Sair</button>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Olá, <span id="nomeAluno"></span></h2>
    <div class="row">
      <div class="col-md-4">
        <div class="card p-3 mb-3">
          <h5>Próximo Horário</h5>
          <p id="proximoHorario">--</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 mb-3">
          <h5>Carga Horária Semanal</h5>
          <div class="progress">
            <div id="barraHoras" class="progress-bar" role="progressbar"></div>
          </div>
          <p id="horasTexto">0 / 6 horas</p>
        </div>
      </div>
    </div>
    <a href="agendar.html" class="btn btn-success">Agendar Horário</a>
    <a href="firmado.html" class="btn btn-info">Meu Horário Firmado</a>
    <button class="btn btn-primary" onclick="registrarEntrada()">Registrar Entrada</button>
  </div>
  <script src="../js/api.js"></script>
  <script>
    async function carregarDashboard() {
      const token = localStorage.getItem('token');
      const resp = await fetch('/api/aluno/dashboard', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const dados = await resp.json();
      document.getElementById('nomeAluno').innerText = dados.aluno.nome;
      document.getElementById('barraHoras').style.width = (dados.horasCadastradas / dados.limiteHoras * 100) + '%';
      document.getElementById('horasTexto').innerText = `${dados.horasCadastradas} / ${dados.limiteHoras} horas`;
      if (dados.agendamentos.length > 0) {
        const prox = dados.agendamentos[0];
        document.getElementById('proximoHorario').innerText = `${prox.data_agendamento} - ${prox.hora_inicio}`;
      }
    }
    carregarDashboard();
    function logout() { localStorage.clear(); window.location = '../index.html'; }
  </script>
</body>
</html>
